name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JellyVision.slnx

      - name: Build plugin (warnings are errors)
        run: dotnet build Jellyfin.Plugin.JellyVision/Jellyfin.Plugin.JellyVision.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.JellyVision.Tests -c Release --no-restore

      - name: Upload plugin dll
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.JellyVision
          path: Jellyfin.Plugin.JellyVision/bin/Release/net9.0/Jellyfin.Plugin.JellyVision.dll
